name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run for that branch obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22.x matches the version the site is developed against. Next 16 requires
      # Node >= 20.9, so this is a floor as well as a convenience.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: fails on a package.json/package-lock.json mismatch instead
      # of silently rewriting the lockfile in CI.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Catches what lint and tsc cannot: bad generateStaticParams, a route that
      # throws during prerender, invalid metadata. Every route here is static.
      - name: Build
        run: npm run build
